apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-deployment
  labels:
    app: event-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event
  template:
    metadata:
      labels:
        app: event
    spec:
      containers:
      - name: portal
        image: ssujay/event-management-portal:v1
        ports:
        - containerPort: 80
